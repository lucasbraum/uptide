name: Uptide
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: uptide-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  migrate:
    if: >-
      (github.event.pull_request.user.login == 'renovate[bot]' ||
       github.event.pull_request.user.login == 'dependabot[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Pin uptide-dev/uptide to a reviewed full commit SHA before enabling.
      - uses: uptide-dev/uptide@REVIEWED_COMMIT_SHA
        with:
          only: zod,stripe
          paths: |
            src/**
            packages/**
          fix: 'true'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.UPTIDE_GITHUB_TOKEN || github.token }}
