name: Release (latest)

# Manual only, and only from a public repository. Publishes one stable version of the
# `uptide` package under the `latest` dist-tag, with npm provenance. Running it is the
# owner's decision: nothing else triggers it. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (x.y.z)
        type: string
        required: true
      dry_run:
        description: Build, test and pack, but do not publish
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the registry verifies this workflow's OIDC identity.
      id-token: write
    env:
      # Set the write-only key only after the privacy/90-day setup in docs/telemetry.md.
      UPTIDE_TELEMETRY_BUILD_KEY: ${{ secrets.UPTIDE_TELEMETRY_BUILD_KEY }}
      UPTIDE_TELEMETRY_BUILD_HOST: https://eu.i.posthog.com
      VERSION: ${{ inputs.version }}
    steps:
      - name: A stable release comes from the public repository's main branch
        if: ${{ github.event.repository.visibility != 'public' || github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::latest is published only from main of a public repository (this is ${{ github.event.repository.visibility }}, ${{ github.ref }})."
          exit 1
      - name: The version is a plain x.y.z
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a stable version (x.y.z)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: The version matches the committed CLI manifest
        run: node scripts/check-release-version.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The version is not on npm yet
        run: |
          if npm view "uptide@$VERSION" version 2>/dev/null | grep -q .; then
            echo "::error::uptide@$VERSION is already published."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm build
        env:
          UPTIDE_BUILD_CLEAN: '1'
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-test the tarball that is about to be published
        run: pnpm smoke 22
      - name: The published build must be stamped clean
        run: node scripts/check-build-stamp.mjs
      # Only the CLI is published: the engine is bundled into it.
      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        run: pnpm --filter uptide publish --tag latest --access public --no-git-checks --dry-run
      - name: Publish to npm under the latest dist-tag
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter uptide publish --tag latest --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  github-release:
    needs: publish-latest
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      # gh creates the missing tag at the published SHA, never the moving main tip.
      - name: Tag the published commit and create its GitHub Release
        run: >-
          gh release create "v$VERSION"
          --target "$RELEASE_COMMIT"
          --title "v$VERSION"
          --generate-notes
