name: Release

# Every push to main, from the public repository only (docs/releasing.md):
# - pending changesets: open or update the Version Packages pull request, and publish a
#   snapshot of main under the `next` dist-tag;
# - no pending changeset and a committed version npm does not have: publish it under
#   `latest`, then tag it and create its GitHub Release from its CHANGELOG entry.
# By hand (workflow_dispatch, a dry run unless told otherwise): publish the committed
# version under `latest` if npm does not have it, whatever changesets are pending. For
# when an automatic publish failed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack, but do not publish, tag or release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - name: A release comes from the public repository's main branch
        if: ${{ github.event.repository.visibility != 'public' || github.ref != 'refs/heads/main' }}
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases run only from main of a public repository (this is $VISIBILITY, $REF)."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/release-plan.mjs >> "$GITHUB_OUTPUT"

  version-pr:
    # Pending changesets become the Version Packages pull request. It is opened with the
    # release app's token: a pull request opened with the default GITHUB_TOKEN triggers no
    # workflow, so it would never get CI. Its commits are the app's, which scripts/dco.mjs
    # exempts in the app's own pull request (scripts/bots.mjs).
    needs: plan
    if: ${{ github.event_name == 'push' && needs.plan.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: The token is the release app's
        env:
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ "$SLUG" != uptide-release ]; then
            echo "::error::The release app is '$SLUG'; DCO and the changeset check exempt only 'uptide-release[bot]' (scripts/bots.mjs)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Commit as the release app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open or update the Version Packages pull request
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: Version Packages
          commit: 'chore(release): version packages'
          setupGitUser: false
          createGithubReleases: false
        env:
          # changesets/action opens the pull request with it; changelog-github reads pull
          # request links with it.
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  publish:
    # One job for both channels. `latest` publishes the committed version. `next` publishes
    # a snapshot of main (`changeset version --snapshot next`) made in this job's checkout,
    # which is thrown away: nothing is committed or pushed, and `latest` is never moved.
    needs: plan
    if: ${{ needs.plan.outputs.channel != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance: the registry verifies this workflow's OIDC identity.
      id-token: write
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # Every build in this job is a release build: stamped clean, also after the snapshot
      # version has changed the tree (packages/core/src/version.ts).
      UPTIDE_BUILD_CLEAN: '1'
      # Set the write-only key only after the privacy/90-day setup in docs/telemetry.md.
      UPTIDE_TELEMETRY_BUILD_KEY: ${{ secrets.UPTIDE_TELEMETRY_BUILD_KEY }}
      UPTIDE_TELEMETRY_BUILD_HOST: https://eu.i.posthog.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The committed version is the one planned
        if: ${{ needs.plan.outputs.channel == 'latest' }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/check-release-version.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Snapshot version for next (never committed)
        if: ${{ needs.plan.outputs.channel == 'next' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm changeset version --snapshot next
      - name: The version to publish
        id: version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$CHANNEL" = latest ] && ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest takes a stable version (x.y.z), not '$version'."
            exit 1
          fi
          if [ "$CHANNEL" = next ] && ! printf '%s' "$version" | grep -Eq -- '-next\.'; then
            echo "::error::next takes a snapshot version (x.y.z-next.*), not '$version'."
            exit 1
          fi
          if npm view "uptide@$version" version 2>/dev/null | grep -q .; then
            echo "::error::uptide@$version is already published."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm lint
      - name: No private material in the repository
        env:
          UPTIDE_PRIVATE_DENYLIST: ${{ secrets.UPTIDE_PRIVATE_DENYLIST }}
        run: node scripts/public-tree.mjs . --require-denylist
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-test the CLI packed from this tree
        run: pnpm smoke 22
      - name: The published build must be stamped clean
        run: node scripts/check-build-stamp.mjs
      # Only the CLI is published: the engine is bundled into it. `changeset publish` is
      # deliberately not used, it would publish every public workspace package.
      - name: Pack the CLI
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter uptide pack --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/uptide-*.tgz)" >> "$GITHUB_OUTPUT"
      - name: The tarball has its legal assets, this repository, the version and no private material
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPTIDE_PRIVATE_DENYLIST: ${{ secrets.UPTIDE_PRIVATE_DENYLIST }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/check-pack.mjs "$TARBALL"
      - name: Publish that tarball under its dist-tag, with provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          # Unused once npm trusted publishing is set up (docs/releasing.md): npm then
          # authenticates with this workflow's OIDC identity, and the secret can go.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dry=''
          if [ "$DRY_RUN" = true ]; then dry='--dry-run'; fi
          npm publish "$TARBALL" --tag "$CHANNEL" --access public --provenance $dry

  github-release:
    # Only a real `latest` publish is tagged and released; snapshots are not.
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.channel == 'latest' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gh creates the tag at the published SHA, never the moving main tip.
      - name: Tag the published commit and create its GitHub Release from the CHANGELOG
        run: |
          node scripts/changelog-entry.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            --target "$RELEASE_COMMIT" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
