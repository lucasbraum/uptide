name: Pages

# Publishes site/ to GitHub Pages as it is, with no build step: on a push to main that
# changes it, or by hand. See site/README.md.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # checkout reads the repository; deploy-pages publishes with the OIDC identity.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The page's own address, for its canonical and social-preview URLs. The one value to
      # change when the page moves to a domain.
      SITE_URL: https://uptide-dev.github.io/uptide/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Write the site URL into the page
        run: |
          sed -i "s#%SITE_URL%#${SITE_URL}#g" site/index.html
          if grep -q '%SITE_URL%' site/index.html; then
            echo "::error::site/index.html still has a %SITE_URL% placeholder."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
