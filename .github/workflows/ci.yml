name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      # No private planning document and no private identifier in the repository. The
      # identifiers are a secret: required on pushes and on pull requests from this
      # repository; a fork has no secrets, so there only the document names are checked.
      - name: No private material
        run: node scripts/public-tree.mjs . ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '--require-denylist' || '' }}
        env:
          UPTIDE_PRIVATE_DENYLIST: ${{ secrets.UPTIDE_PRIVATE_DENYLIST }}
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify the local bot PR loop
        if: matrix.node == 22
        env:
          UPTIDE_NETWORK: '1'
        run: pnpm --filter @uptide/core exec vitest run src/action/action.test.ts

  smoke:
    # The packed CLI, installed in a clean Node container, against npm, pnpm and yarn fixtures.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm smoke ${{ matrix.node }}
