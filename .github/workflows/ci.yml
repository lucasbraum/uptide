name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      # No private planning document and no private identifier in the repository. The
      # identifiers are a secret: required on pushes and on pull requests from this
      # repository; a fork has no secrets, so there only the document names are checked.
      # Dependabot's own pull requests get no repository secrets either, and are never given
      # this one (CONTRIBUTING.md): with the opener GitHub records as dependabot[bot] (the
      # same gate as the DCO exemption) and no denylist, the identifier scan is skipped with
      # a notice. Whatever such a pull request brings is scanned with the secret on its
      # push to main. Every other missing denylist still fails.
      - name: No private material
        env:
          UPTIDE_PRIVATE_DENYLIST: ${{ secrets.UPTIDE_PRIVATE_DENYLIST }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
            node scripts/public-tree.mjs .
          elif [ "$EVENT" = pull_request ] && [ "$PR_AUTHOR" = 'dependabot[bot]' ] && [ -z "$UPTIDE_PRIVATE_DENYLIST" ]; then
            echo "::notice title=No private material::Private identifier scan skipped: Dependabot pull requests get no repository secrets, and this one is never given to them. Document names are still checked; the merge to main is scanned with the denylist."
            node scripts/public-tree.mjs .
          else
            node scripts/public-tree.mjs . --require-denylist
          fi
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify the local bot PR loop
        if: matrix.node == 22
        env:
          UPTIDE_NETWORK: '1'
        run: pnpm --filter @uptide/core exec vitest run src/action/action.test.ts

  smoke:
    # The packed CLI, installed in a clean Node container, against npm, pnpm and yarn fixtures.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm smoke ${{ matrix.node }}
