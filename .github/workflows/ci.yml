name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      # No private planning document and no private identifier in the repository. Which
      # scan runs on which event, and why Dependabot's own pull requests skip the identifier
      # part: scripts/private-material.mjs.
      - name: No private material
        env:
          UPTIDE_PRIVATE_DENYLIST: ${{ secrets.UPTIDE_PRIVATE_DENYLIST }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/private-material.mjs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify the local bot PR loop
        if: matrix.node == 22
        env:
          UPTIDE_NETWORK: '1'
        run: pnpm --filter @uptide/core exec vitest run src/action/action.test.ts

  docs:
    # Every relative link in the Markdown resolves, and the README's packs table matches what
    # each pack's verification.json and ground truth say (`pnpm docs:packs` rewrites it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:links
      - run: pnpm docs:packs --check

  smoke:
    # The packed CLI, installed in a clean Node container, against npm, pnpm and yarn fixtures.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm smoke ${{ matrix.node }}
